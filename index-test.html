<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R M Hunt Fine Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eeece6;
      --ink: #111111;
      --muted: #262626;
      --gutter: clamp(1.15rem, 5vw, 9rem);
      --gap: clamp(.7rem, 1.6vw, 1.25rem);
      --page: 1480px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    .wrap {
      max-width: var(--page);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 2rem;
      padding: clamp(2rem, 8vw, 8rem) 0 1.15rem;
    }
    .rule {
      border: 0;
      border-top: 1px solid var(--ink);
      opacity: .22;
      margin: 0 0 clamp(2.5rem, 6vw, 5rem);
    }
    .rule-foot { margin: 0 0 1.15rem; }
    .nav {
      display: flex;
      justify-content: flex-end;
      gap: 1.75rem;
      font-family: system-ui, sans-serif;
      font-size: .68rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .nav a { color: var(--muted); text-decoration: none; }
    .nav a[aria-current="page"] { color: var(--ink); }
    header { padding: 0; min-width: 0; max-width: 42rem; }
    .eyebrow {
      margin: 0 0 .9rem;
      font-family: system-ui, sans-serif;
      font-size: .7rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 1rem;
      font-family: "Cormorant SC", Georgia, serif;
      font-weight: 200;
      font-size: clamp(1.7rem, 6vw, 2.2rem);
      line-height: .95;
      letter-spacing: .02em;
    }
    .portfolio {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--gap);
      padding-bottom: clamp(2.5rem, 6vw, 5rem);
    }
    .item {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }
    .item img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(17, 17, 17, .92);
      z-index: 40;
      padding: 4.5rem 1.25rem 3.5rem;
      overflow: hidden;
    }
    .lightbox.is-open { display: grid; }
    .stage {
      width: min(92vw, 1200px);
      height: 78vh;
      display: grid;
      place-items: center;
      touch-action: pan-y;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 78vh;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: translateX(0);
      transition: transform .5s cubic-bezier(.16, 1, .3, 1), opacity .35s ease;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }
    .lightbox img.dragging { transition: none; }
    .lightbox .close,
    .lightbox .caption,
    .lightbox .arrow {
      font-family: system-ui, sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #eeece6;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .lightbox .close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: .7rem;
    }
    .lightbox .caption {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      font-size: .7rem;
      pointer-events: none;
      text-align: center;
      width: 90%;
    }
    .lightbox .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.8rem;
      letter-spacing: 0;
      line-height: 1;
      padding: .4rem;
      opacity: .75;
    }
    .lightbox .prev { left: .35rem; }
    .lightbox .next { right: .35rem; }
    .site-footer { padding: 0 0 clamp(2rem, 5vw, 3.5rem); }
    .site-footer .eyebrow { margin: 0; }
    @media (max-width: 980px) {
      .portfolio { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .masthead {
        flex-direction: column;
        align-items: flex-start;
        gap: 1.1rem;
        padding-top: 1.5rem;
      }
      .nav { justify-content: flex-start; }
      header { max-width: none; }
    }
    @media (max-width: 560px) {
      .portfolio { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="masthead">
      <header>
        <p class="eyebrow">Selected Works</p>
        <h1>R M Hunt Fine Art</h1>
        <p class="eyebrow">info@roberthunt.com</p>
      </header>
      <nav class="nav">
        <a href="index-test.html" aria-current="page">Works</a>
        <a href="about-test.html">About</a>
      </nav>
    </div>
    <hr class="rule">
    <div class="portfolio">
      <button class="item" type="button" data-full="https://picsum.photos/id/1015/1600/1000" data-caption="River canyon">
        <img src="https://picsum.photos/id/1015/900/900" alt="River canyon">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/1025/900/1400" data-caption="Waiting">
        <img src="https://picsum.photos/id/1025/900/900" alt="Waiting">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/1018/1600/900" data-caption="Mountain road">
        <img src="https://picsum.photos/id/1018/900/900" alt="Mountain road">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/1039/1600/1000" data-caption="Forest fall">
        <img src="https://picsum.photos/id/1039/900/900" alt="Forest fall">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/1043/1600/1100" data-caption="Coastal town">
        <img src="https://picsum.photos/id/1043/900/900" alt="Coastal town">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/287/900/1400" data-caption="Fogged pines">
        <img src="https://picsum.photos/id/287/900/900" alt="Fogged pines">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/292/1600/800" data-caption="Open water">
        <img src="https://picsum.photos/id/292/900/900" alt="Open water">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/365/1600/1000" data-caption="Harbor crates">
        <img src="https://picsum.photos/id/365/900/900" alt="Harbor crates">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/308/900/1400" data-caption="Desert stair">
        <img src="https://picsum.photos/id/308/900/900" alt="Desert stair">
      </button>
      <button class="item" type="button" data-full="https://picsum.photos/id/433/1600/1000" data-caption="Bear study">
        <img src="https://picsum.photos/id/433/900/900" alt="Bear study">
      </button>
    </div>
    <hr class="rule rule-foot">
    <footer class="site-footer">
      <p class="eyebrow">© 2026 R M Hunt Fine Art. All rights reserved.</p>
    </footer>
  </div>
  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="close" id="lightbox-close">Close</button>
    <button type="button" class="arrow prev" id="lightbox-prev" aria-label="Previous">‹</button>
    <div class="stage">
      <img id="lightbox-image" alt="">
    </div>
    <button type="button" class="arrow next" id="lightbox-next" aria-label="Next">›</button>
    <p class="caption" id="lightbox-caption"></p>
  </div>
  <script>
    const box = document.getElementById('lightbox');
    const picture = document.getElementById('lightbox-image');
    const caption = document.getElementById('lightbox-caption');
    const items = Array.from(document.querySelectorAll('.portfolio button[data-full]'));
    let index = 0;
    let startX = 0;
    let startY = 0;
    let deltaX = 0;
    let swiping = false;
    let locked = false;

    function load(i) {
      index = (i + items.length) % items.length;
      const item = items[index];
      const thumb = item.querySelector('img');
      const full = item.dataset.full;
      caption.textContent = item.dataset.caption || '';
      picture.alt = thumb ? thumb.alt : item.dataset.caption;
      if (thumb && thumb.src) picture.src = thumb.src;
      if (full && full !== picture.src) {
        const hi = new Image();
        hi.onload = function () {
          if (items[index] === item) picture.src = full;
        };
        hi.src = full;
      }
      const neighbor = items[(index + 1) % items.length];
      if (neighbor && neighbor.dataset.full) {
        const preload = new Image();
        preload.src = neighbor.dataset.full;
      }
    }

    function settle(x) {
      picture.style.transform = 'translateX(' + x + 'px)';
    }

    function go(step) {
      if (locked) return;
      locked = true;
      const leave = step > 0 ? -window.innerWidth : window.innerWidth;
      const enter = -leave;
      picture.classList.remove('dragging');
      settle(leave);
      window.setTimeout(function () {
        load(index + step);
        settle(enter);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { settle(0); });
        });
        window.setTimeout(function () { locked = false; }, 480);
      }, 220);
    }

    function openLightbox(i) {
      load(i);
      settle(0);
      box.hidden = false;
      box.classList.add('is-open');
    }

    function closeLightbox() {
      box.classList.remove('is-open');
      box.hidden = true;
      settle(0);
    }

    document.querySelector('.portfolio').addEventListener('click', function (event) {
      const item = event.target.closest('button[data-full]');
      if (!item) return;
      openLightbox(items.indexOf(item));
    });

    document.getElementById('lightbox-close').addEventListener('click', function (event) {
      event.stopPropagation();
      closeLightbox();
    });
    document.getElementById('lightbox-prev').addEventListener('click', function (event) {
      event.stopPropagation();
      go(-1);
    });
    document.getElementById('lightbox-next').addEventListener('click', function (event) {
      event.stopPropagation();
      go(1);
    });
    box.addEventListener('click', function (event) {
      if (event.target === box || event.target.classList.contains('stage')) closeLightbox();
    });

    box.addEventListener('touchstart', function (event) {
      if (!event.changedTouches.length || locked) return;
      startX = event.changedTouches[0].clientX;
      startY = event.changedTouches[0].clientY;
      deltaX = 0;
      swiping = true;
      picture.classList.add('dragging');
    }, { passive: true });

    box.addEventListener('touchmove', function (event) {
      if (!swiping || !event.changedTouches.length) return;
      const x = event.changedTouches[0].clientX;
      const y = event.changedTouches[0].clientY;
      const dx = x - startX;
      const dy = y - startY;
      if (Math.abs(dx) < Math.abs(dy)) return;
      deltaX = dx;
      settle(dx);
    }, { passive: true });

    box.addEventListener('touchend', function () {
      if (!swiping) return;
      swiping = false;
      picture.classList.remove('dragging');
      if (Math.abs(deltaX) > 60) go(deltaX < 0 ? 1 : -1);
      else settle(0);
      deltaX = 0;
    }, { passive: true });

    document.addEventListener('keydown', function (event) {
      if (!box.classList.contains('is-open')) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') go(-1);
      if (event.key === 'ArrowRight') go(1);
    });
  </script>
</body>
</html>
